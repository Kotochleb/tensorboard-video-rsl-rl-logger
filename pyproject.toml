[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "ruff>=0.14.14",
  "ty>=0.0.53",
  "pre-commit>=4.6.0"
]

[project]
name = "tensorboard-video-log-writer"
version = "0.1.0"
description = "RSL-rl log writer with a patched video support for tensorboard"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "rsl-rl-lib>=5.4.0",
  "moviepy>=2.0.0",
  "pillow>=12.2.0"
]

[tool.ruff]
indent-width = 2
src = ["src/tensorboard_video_log_writer"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.uv]
# moviepy 2.x caps pillow at <12 while mjviser (via mjlab) needs >=12.2.
# The cap is precautionary; moviepy works with pillow 12, so lift it.
override-dependencies = ["pillow>=12.2.0"]
